<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에이전트 실행 기록</title>
<style>
:root{font:14px/1.65 Inter,"Malgun Gothic",sans-serif;color:#18231e;background:#f4f2e9}*{box-sizing:border-box}body{margin:0}header{padding:16px 24px;border-bottom:1px solid #cbd4c9;background:#faf9f2;display:flex;align-items:center;gap:16px}h1{font-size:19px;margin:0}button,select{font:inherit;padding:7px 12px;border:1px solid #cbd4c9;border-radius:4px;background:#faf9f2;color:inherit;cursor:pointer}button:focus-visible,summary:focus-visible{outline:2px solid #255d49;outline-offset:3px}.layout{display:grid;grid-template-columns:250px minmax(300px,1fr);height:calc(100vh - 73px)}aside{overflow:auto;border-right:1px solid #cbd4c9;padding:12px}aside button{display:block;width:100%;text-align:left;margin:0 0 8px;border:0}aside button[aria-current=true]{background:#dfeadd}main{padding:16px 24px;overflow:auto;min-width:0}.muted{font-size:12px;color:#526052}#tools{margin:0 0 16px;padding:10px 0;border-bottom:1px solid #cbd4c9}.event{border-top:1px solid #cbd4c9;padding:10px 0}.event>summary{cursor:pointer;font-weight:600}.event.failed>summary{color:#993b36}dl{margin:4px 0 12px}dl>div{display:grid;grid-template-columns:160px minmax(0,1fr);padding:7px 0;border-bottom:1px solid #dde1d6;gap:12px}dt{color:#526052;font-size:12px}dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}h3{font-size:13px;margin:12px 0 5px}p{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}pre{font:12px/1.7 Consolas,monospace;background:#ecefe5;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:460px;overflow:auto;margin:0}.fields details{margin:8px 0}.fields summary{cursor:pointer;color:#526052;padding:5px 0}.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}.error pre{background:#f2eae2}.pages{display:flex;align-items:center;gap:12px;margin:6px 0}.raw{margin-top:16px}.body{padding:8px 0}.status{font-weight:600;color:#255d49}.failed .status{color:#993b36}@media(max-width:900px){.layout{grid-template-columns:180px minmax(0,1fr)}main{padding:12px}.panels{grid-template-columns:1fr}}
</style><header><h1>에이전트 실행 기록</h1><span class="muted">로컬 기록 · 선택한 실행의 원본 이벤트</span><button id="refresh">새로고침</button><span id="health" role="status" class="muted"></span></header>
<div class="layout"><aside aria-label="실행 선택" id="runs"></aside><main><div id="tools"></div><h2 id="title">실행을 선택하세요</h2><p id="audit" class="muted"></p><div id="events"></div></main></div>
<script>
const $=s=>document.querySelector(s),el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const labels={run_start:'실행 시작',request_input:'모델 요청',model_response:'모델 응답',model_error:'모델 오류',span_start:'구간 시작',span_end:'구간 종료',python_execution:'Python 실행',model_call:'모델 호출',tool_execution:'도구 실행',attachment:'피드백 전달',termination:'실행 종료',collector_health:'수집 상태',transport_attempt:'HTTP 전송',stream_receipt:'스트림 수신',stream_end:'스트림 종료',resource_sample:'자원 표본',input:'모델에 보낸 입력',output:'반환한 응답',code:'코드',stdout:'표준 출력',stderr:'오류 출력',goal:'목표',current_goal:'이번 호출의 목표',stage:'단계',signal:'다음 행동',markdown:'모델의 설명',recent_diagnostic:'오류 피드백',accepted_cells:'이전에 성공한 셀',remaining_calls:'남은 호출 수',reasoning:'추론 설정',summary:'공식 추론 요약',role:'역할',content:'메시지 내용',instructions:'지시문',status:'상태'};
function literal(v){return v===null?'없음':v===''?'없음':typeof v==='object'?JSON.stringify(v):String(v)}
function textPanel(text){const box=el('div'),pre=el('pre');pre.tabIndex=0;let page=0;const count=Math.max(1,Math.ceil(text.length/60000));function show(){pre.textContent=text.slice(page*60000,(page+1)*60000);if(info)info.textContent=`${page+1} / ${count} · 전체 ${text.length.toLocaleString()}자`;if(prev)prev.disabled=page===0;if(next)next.disabled=page===count-1}let info,prev,next;if(count>1){const nav=el('div',undefined,'pages');prev=el('button','이전');next=el('button','다음');info=el('span');prev.onclick=()=>{page--;show()};next.onclick=()=>{page++;show()};nav.append(prev,info,next);box.append(nav)}box.append(pre);show();return box}
function disclosure(title,fn){const d=el('details');d.append(el('summary',title));let filled=false;d.ontoggle=()=>{if(d.open&&!filled){d.append(fn());filled=true}};return d}
function decode(t){if(typeof t!=='string')return t;try{const p=JSON.parse(t);return typeof p==='object'&&p!==null?p:t}catch{return t}}
function fields(value,key='',depth=0){const box=el('div',undefined,'fields');value=decode(value);if(['code','failed_cell','stdout','stderr','recent_diagnostic'].includes(key)&&typeof value==='string'){box.append(textPanel(value));return box}if(value===null||typeof value!=='object'){box.append(typeof value==='string'&&value.length>60000?textPanel(value):el('p',literal(value)));return box}const pairs=Array.isArray(value)?value.map((v,i)=>[String(i+1),v]):Object.entries(value),facts=el('dl');for(const[k,v]of pairs){const name=labels[k]||k;if(v===null||typeof v!=='object'&&String(v).length<150&&!String(v).includes('\n')&&!['code','goal','current_goal','markdown'].includes(k)){const row=el('div');row.append(el('dt',name),el('dd',literal(v)));facts.append(row)}else if(depth>1||['accepted_cells','goal_history','input','visible_task_card','execution_contract'].includes(k)){box.append(disclosure(name,()=>fields(v,k,depth+1)))}else{const section=el('section');section.append(el('h3',name),fields(v,k,depth+1));if(k==='stderr'||k==='recent_diagnostic')section.className='error';box.append(section)}}if(facts.childElementCount)box.prepend(facts);return box}
let current,state,selectionSequence=0;
async function select(id){const ticket=++selectionSequence;current=id;$('#events').setAttribute('aria-busy','true');for(const b of $('#runs').children)b.setAttribute('aria-current',b.dataset.id===id);const res=await fetch('/run?id='+encodeURIComponent(id),{cache:'no-store'});if(!res.ok)throw Error('실행 기록을 열 수 없습니다');const data=await res.json();if(current!==id||ticket!==selectionSequence)return;$('#title').textContent=data.events[0]?.attempt_id||'실행 기록';$('#audit').textContent=`원본 이벤트 ${data.audit.events}개 · 모델 요청 ${data.audit.requests}개 · ${data.audit.completed?'실행 종료':'진행 중 또는 중단'} · 검사 문제 ${data.audit.errors.length}개`;
const receipt=state?.runs?.[id]?.receipt,collectors=receipt?.collectors||{};$('#tools').replaceChildren(el('strong','수집 도구'));for(const[name,label]of [['relay','NVIDIA NeMo Relay'],['phoenix','OpenTelemetry · Phoenix'],['openai_sdk','OpenAI Agents SDK']]){const c=collectors[name],verified=name==='relay'?c?.scopes_verified>0:name==='phoenix'?c?.export_acknowledged&&c?.spans===c?.spans_verified_in_phoenix:c?.status==='acknowledged';$('#tools').append(el('p',`${label} · ${verified?'연결 검증':c?.status||'확인 전'}`,'muted'))}$('#events').replaceChildren();const bodies=new Map(data.bodies.map(b=>[b.event_id,b.parts])),exec=new Map(data.executions.map(b=>[b.operation_id,b.parts]));
for(const e of data.events){const box=el('details',undefined,'event'+(['failed','error','timeout'].includes(e.status)?' failed':''));box.dataset.eventId=e.event_id;box.append(el('summary',`${e.call_id||'실행'} · ${labels[e.kind]||e.kind}${e.operation?' · '+(labels[e.operation]||e.operation):''} · ${e.status||'관측'}`));box.append(el('p',`원본 ${e.source_line}행 · ${e.ts}`,'muted'));let rendered=false;box.ontoggle=()=>{if(!box.open||rendered)return;rendered=true;const parts=bodies.get(e.event_id)||exec.get(e.event_id)||(e.span_id?exec.get(e.span_id):null);if(parts){const body=el('div',undefined,parts.code?'panels body':'body');for(const[k,p]of Object.entries(parts)){const section=el('section');section.append(el('h3',labels[k]||k),fields(p.text,k));body.append(section)}box.append(body)}box.append(disclosure('기록 필드',()=>fields(e)));if(parts)box.append(disclosure('JSON 원문 보기',()=>textPanel(JSON.stringify(parts,null,2))))};$('#events').append(box)}$('#events').setAttribute('aria-busy','false')}
async function refresh(){try{const res=await fetch('/runs',{cache:'no-store'});if(!res.ok)throw Error('수집기 연결을 확인하세요');const data=await res.json();state=data.state;$('#runs').replaceChildren();for(const r of data.runs){const button=el('button',`${r.attempt_id||r.run_id}\n${r.events}개 이벤트 · ${r.errors.length}개 문제`);button.dataset.id=r.id;button.onclick=()=>select(r.id).catch(e=>$('#health').textContent=e.message);$('#runs').append(button)}$('#health').textContent=state?.heartbeat?'수집기 확인 '+new Date(state.heartbeat).toLocaleTimeString():'수집기 확인 중';const id=data.runs.some(r=>r.id===current)?current:data.runs.at(-1)?.id;if(id)await select(id)}catch(e){$('#health').textContent=e.message}}
$('#refresh').onclick=refresh;refresh();
</script></html>
